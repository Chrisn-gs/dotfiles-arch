# Rime 配置文件 - 雾凇拼音
patch:
  schema_list:
    - schema: rime_ice
  switches:
    - name: ascii_mode
      reset: 0
      states: [ 中, Ａ ]
    - name: ascii_punct
      states: [ ¥, $ ]
    - name: traditionalization
      states: [ 简, 繁 ]
    - name: emoji
      states: [ 💀, 😄 ]
      reset: 1
    - name: full_shape
      states: [ 半角, 全角 ]
  ascii_composer/switch_key/+:
    Shift_L: commit_code
    Shift_R: noop
